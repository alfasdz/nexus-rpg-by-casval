services:
  - type: web
    name: nexus-rpg
    env: node
    plan: free
    buildCommand: echo "Ready for deployment"
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: TOKEN_SECRET
        generateValue: true
